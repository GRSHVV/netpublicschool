<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Face Recognition Pickup System</title>
  <link rel="stylesheet" href="style.css" />
  <!-- face-api script must be present at this path -->
  <script defer src="face-api.min.js"></script>
  <script defer src="db.js"></script>
  <script defer src="index.js"></script>
</head>
<body>
  <div id="container">
    <!-- LEFT: main area (camera + content) -->
    <section id="mainPanel">
      <div id="topPanel">
        <video id="video" autoplay muted playsinline></video>
        <canvas id="overlay"></canvas>
      </div>
      <div id="bottomPanel">
        <div id="modeContent">Select a mode from the right menu.</div>
      </div>
    </section>

    <!-- RIGHT: menu -->
    <aside id="sideMenu">
      <h2>Pickup Admin Panel</h2>

      <button id="btnAdmin">👤 Register Parent</button>
      <button id="btnClass">🏷 Manage Classes & Sections</button>
      <button id="btnChild">👶 Register Child</button>
      <button id="btnLink">🔗 Link Parent–Child</button>
      <button id="btnRecognition">🎥 Recognition Mode</button>

      <hr />

      <div class="statusBox">
        <div>👪 Parents: <span id="parentCount">0</span></div>
        <div>🧒 Children: <span id="childCount">0</span></div>
      </div>

      <label for="cameraSelect">📸 Camera</label>
      <select id="cameraSelect"></select>

      <label class="checkboxLabel">
        <input type="checkbox" id="noPickupMode" />
        Continuous Recognition
      </label>

      <div id="statusMsg">Ready</div>
    </aside>
  </div>
</body>
</html>
