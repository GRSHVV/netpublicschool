<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart Pickup System</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="manifest" href="./manifest.json" />
  <meta name="theme-color" content="#166534" />
  <script defer src="./face-api.min.js"></script>
  <script defer src="./db.js"></script>
  <script defer src="./index.js"></script>
</head>
<body>
  <div id="appContainer">
    <!-- MENU PANEL -->
    <div id="menuPanel">
      <h2>Menu</h2>
      <button id="btnAdmin">Register Parent</button>
      <button id="btnChild">Register Child</button>
      <button id="btnClass">Manage Classes</button>
      <button id="btnLink">Link Parent & Child</button>
      <button id="btnRecognition">Recognition</button>
    </div>

    <!-- MAIN PANEL -->
    <div id="mainPanel">
      <!-- TOP: Camera + Form -->
      <div id="topPanel">
        <div id="cameraArea">
          <video id="video" autoplay muted playsinline></video>
          <canvas id="overlay"></canvas>
          <select id="cameraSelect"></select>
        </div>
        <div id="modeContent">
          <!-- Dynamic content loads here -->
        </div>
      </div>

      <!-- BOTTOM: Audit/Status -->
      <div id="bottomPanel">
        <div id="statusMsg">Initializing...</div>
        <div id="recognitionResult" class="result-box"></div>
      </div>
    </div>
  </div>

  <!-- PWA Service Worker -->
  <script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function() {
      navigator.serviceWorker.register('./service-worker.js')
        .then(function(reg) {
          console.log('✅ Service worker registered:', reg);
        })
        .catch(function(err) {
          console.error('❌ SW registration failed:', err);
        });
    });
  }
  </script>
</body>
</html>
