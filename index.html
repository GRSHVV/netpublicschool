<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NET Public School-Smart Pickup System</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="manifest" href="./manifest.json" />
  <meta name="theme-color" content="#166534" />
  <script defer src="./face-api.min.js"></script>
  <script defer src="./db.js"></script>
  <script defer src="./index-min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>

<body>
  <div id="appContainer">
    <!-- LEFT MENU PANEL -->
    <div id="menuPanel">
      <h2>Smart Pickup</h2>

      <button id="btnDashboard">🏠 Dashboard</button>
	  <button id="btnAdmin">👤 Register Parent</button>
	  <button id="btnUpdateParent">📝 Update Parent</button>
	  <button id="btnClass">🏷 Manage Classes & Sections</button>
	  <button id="btnChild">👶 Register Child</button>
	  <button id="btnLink">🔗 Link Parent–Child</button>
	  <button id="btnRecognition">🎥 Recognition Mode</button>
	  <button id="btnReports">📊 Reports</button>
	  <button id="btnExport">⬇️ Export Data (ZIP)</button>
	  <button id="btnImport">⬆️ Import Data (ZIP)</button>
	

      <!-- COUNTS + CAMERA SELECTOR BELOW MENU -->
      <div id="menuStatsArea">
        <div id="statsHeader">
          <div><strong>👨 Parents:</strong> <span id="parentCount">0</span></div>
          <div><strong>👧 Children:</strong> <span id="childCount">0</span></div>
          <!-- <button id="refreshStatsBtn" title="Refresh Counts">🔄</button>-->
        </div>

        <div id="cameraSelectorContainer">
          <label for="cameraSelect">Camera</label>
          <select id="cameraSelect"></select>
        </div>
	<hr />
	<label style="font-size:0.9rem;">
  	<input type="checkbox" id="noPickupMode" />
  	Continuous Recognition (No Pickup)
	</label>
	
      </div>
    </div>

    <!-- MAIN PANEL -->
    <div id="mainPanel">
      <div id="topPanel">
        <!-- SMALL CAMERA AREA -->
        <div id="cameraArea">
          <video id="video" autoplay muted playsinline></video>
          <canvas id="overlay"></canvas>
        </div>

        <!-- BIGGER FORM AREA -->
        <div id="modeContent">
          <!-- Dynamic mode content -->
        </div>
      </div>

      <!-- BOTTOM AUDIT / STATUS AREA -->
      <div id="bottomPanel">
        <div id="statusMsg">Initializing...</div>
        <div id="recognitionResult" class="result-box"></div>
      </div>
    </div>
  </div>

  <!-- PWA Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('./service-worker.js')
          .then(reg => console.log('✅ Service worker registered:', reg))
          .catch(err => console.error('❌ Service worker registration failed:', err));
      });
    }
  </script>
  <footer id="appFooter">
  	<a href="https:\\innovai.in">© INNOVAI SOLUTIONS PRIVATE LIMITED 2025</a>
  </footer>
	
</body>
</html>
