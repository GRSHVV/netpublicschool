<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Face Recognition Pickup System</title>
  <link rel="stylesheet" href="style.css" />
  <script defer src="face-api.min.js"></script>
  <script defer src="db.js"></script>
  <script defer src="index.js"></script>
</head>
<body>
  <div id="app">
    <aside id="menu">
      <h2>Menu</h2>
      <button id="btnAdmin">Register Parent</button>
      <button id="btnClass">Manage Classes & Sections</button>
      <button id="btnChild">Register Child</button>
      <button id="btnLink">Link Parent–Child</button>
      <button id="btnRecognition">Recognition Mode</button>
      <hr />
      <div id="counts">
        Parents: <span id="parentCount">0</span><br />
        Children: <span id="childCount">0</span>
      </div>
      <label style="margin-top:10px;">Camera</label>
      <select id="cameraSelect"></select>
      <label style="margin-top:10px;">
        <input type="checkbox" id="noPickupMode" />
        Continuous Recognition
      </label>
      <div id="statusMsg">Initializing...</div>
    </aside>

    <main id="main">
      <div id="top-panel">
        <video id="video" autoplay muted playsinline></video>
        <canvas id="overlay"></canvas>
      </div>
      <div id="bottom-panel">
        <div id="modeContent">Select an option from the menu.</div>
      </div>
    </main>
  </div>
</body>
</html>
