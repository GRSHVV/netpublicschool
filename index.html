<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart Pickup System</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="manifest" href="./manifest.json" />
  <meta name="theme-color" content="#166534" />
  <script defer src="./face-api.min.js"></script>
  <script defer src="./db.js"></script>
  <script defer src="./index.js"></script>
</head>

<body>
  <div id="appContainer">
    <!-- LEFT MENU PANEL -->
    <div id="menuPanel">
      <h2>Smart Pickup</h2>

      <button id="btnAdmin">Register Parent</button>
      <button id="btnChild">Register Child</button>
      <button id="btnClass">Manage Classes</button>
      <button id="btnLink">Link Parent & Child</button>
      <button id="btnRecognition">Recognition</button>

      <!-- COUNTS + CAMERA SELECTOR -->
      <div id="statsContainer">
        <div id="statsBox">
          <p><strong>👨 Parents:</strong> <span id="parentCount">0</span></p>
          <p><strong>👧 Children:</strong> <span id="childCount">0</span></p>
        </div>
        <div id="cameraSelectorContainer">
          <label for="cameraSelect">Camera</label>
          <select id="cameraSelect"></select>
        </div>
      </div>
    </div>

    <!-- MAIN PANEL -->
    <div id="mainPanel">
      <div id="topPanel">
        <!-- SMALL CAMERA AREA -->
        <div id="cameraArea">
          <video id="video" autoplay muted playsinline></video>
          <canvas id="overlay"></canvas>
        </div>

        <!-- BIGGER FORM AREA -->
        <div id="modeContent">
          <!-- Dynamic mode content (registration, linking, etc.) -->
        </div>
      </div>

      <!-- BOTTOM AUDIT / STATUS AREA -->
      <div id="bottomPanel">
        <div id="statusMsg">Initializing...</div>
        <div id="recognitionResult" class="result-box"></div>
      </div>
    </div>
  </div>

  <!-- PWA Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('./service-worker.js')
          .then(reg => console.log('✅ Service worker registered:', reg))
          .catch(err => console.error('❌ Service worker registration failed:', err));
      });
    }
  </script>
</body>
</html>
